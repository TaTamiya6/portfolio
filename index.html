<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ポートフォリオ</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- ヘッダー -->
  <header class="header">
    <div class="container">
      <h1 class="logo">ポートフォリオ</h1>
      <nav class="nav">
        <ul>
          <li><a href="#about">About</a></li>
          <li><a href="#works">Works</a></li>
          <li><a href="#contact">お問い合わせ</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- ヒーローセクション -->
  <section class="hero">
    <div class="container">
      <h2>My portfolio</h2>
      <p></p>
      <a href="#works" class="btn primary">Works</a>
      <a href="#contact" class="btn secondary">お問い合わせ</a>
    </div>
  </section>

  <!-- 自己紹介セクション -->
  <section class="about" id="about">
  <h2>自己紹介</h2>
  <div class="about-content">
    <img src="images/samurai.jpg" alt="プロフィール写真" class="profile-photo">
    <div class="about-text">
      <p>閲覧いただき</p>
      <h3>スキル</h3>
      <ul class="skills">
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
        <li>PHP</li>
      </ul>
    </div>
  </div>
</section>


  <!-- Worksセクション -->
  <section id="works" class="works">
    <div class="container">
      <h3>Works</h3>
      <div class="work-list">
        <div class="work-card">
          <h4>Coming Soon</h4>
          <p>現在準備中です。</p>
        </div>
      </div>
    </div>
  </section>

  <!-- gameセクション -->
  <section class="games" id="games">
  <h2>ミニゲーム</h2>
  <div class="game-wrapper">
    <div class="game-container">
      <a href="asobi/hitandblow.html" class="game-card">
        <img src="images/hitandblow.jpg" alt="Hit ＆ Blow">
        <p>Hit ＆ Blow</p>
      </a>

      <a href="puzzle.html" class="game-card">
        <img src="images/puzzle.jpg" alt="パズルゲーム">
        <p>パズルゲーム</p>
      </a>

      <a href="memory.html" class="game-card">
        <img src="images/memory.jpg" alt="記憶力ゲーム">
        <p>空</p>
      </a>

      <a href="quiz.html" class="game-card">
        <img src="images/quiz.jpg" alt="クイズゲーム">
        <p>クイズゲーム</p>
      </a>
    </div>
  </div>
  </section>

  <script src="js/script.js"></script>
</body>
</html>
